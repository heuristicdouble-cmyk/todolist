<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./listStyle.css" />
    <title>ToDoリスト</title>
  </head>
  <body>
    <h2>
      todoリスト
      <button class="button-clear-completed">チェックしたタスクを消去</button>
      <!-- <button class="button-bw">反転</button> -->
    </h2>
    <!--タスクフォーム-->
    <form id="task-form">
      <section class="list">
        <table>
          <tbody>
            <tr>
              <td>
                <input
                  type="text"
                  class="input-taskName"
                  placeholder="タスク名"
                  required
                />
              </td>
              <td>
                <input
                  type="text"
                  class="input-deadline"
                  placeholder="期日"
                  required
                />
              </td>
              <td>
                <input
                  type="text"
                  class="input-comment"
                  placeholder="コメント"
                />
              </td>
            </tr>
          </tbody>
        </table>
        <button class="button">リストに追加</button>
      </section>
    </form>

    <!--タスクリスト-->
    <table class="task-list" border="1">
      <thead class="task-list-head">
        <tr>
          <th style="width: 1rem"></th>
          <th style="width: 20rem">タスク名</th>
          <th style="width: 7rem">ステータス</th>
          <th style="width: 5rem">期日</th>
          <th style="width: 30rem">コメント</th>
        </tr>
      </thead>
      <!--ユーザー入力分の表示リスト-->
      <tbody id="task-list-body"></tbody>
    </table>

    <script src="./listButton.js"></script>
  </body>
</html>
