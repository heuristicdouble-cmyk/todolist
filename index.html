<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./listStyle.css" />
    <title>ToDoList</title>
  </head>
  <body>
    <h2>
      todo list
      <button class="button-clear-completed">Delete item checked</button>
      <button class="button-bw">reverse</button>
    </h2>
    <!--タスクフォーム-->
    <form id="task-form">
      <section class="list">
        <table>
          <tbody>
            <tr>
              <td>
                <input
                  type="text"
                  class="input-taskName"
                  placeholder="task name"
                  required
                />
              </td>
              <td>
                <input
                  type="date"
                  class="input-deadline"
                  placeholder="deadline"
                />
              </td>
              <td>
                <input
                  type="text"
                  class="input-comment"
                  placeholder="comment"
                />
              </td>
            </tr>
          </tbody>
        </table>
        <button class="button">add list</button>
      </section>
    </form>

    <!--タスクリスト-->
    <table class="task-list" border="1">
      <thead class="task-list-head">
        <tr>
          <th style="width: 1rem"></th>
          <th style="width: 20rem">task name</th>
          <th style="width: 9rem">status</th>
          <th style="width: 5rem">deadline</th>
          <th style="width: 30rem">comment</th>
        </tr>
      </thead>
      <!--ユーザー入力分の表示リスト-->
      <tbody id="task-list-body"></tbody>
    </table>

    <script src="./listButton.js"></script>
  </body>
</html>
